# Long-running ExtendDB server, applied after manifests/init-job.yaml has
# completed successfully.
#
# Templated by scripts/deploy.sh with envsubst: ${EXTENDDB_NAMESPACE},
# ${EXTENDDB_IMAGE}.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extenddb
  namespace: ${EXTENDDB_NAMESPACE}
  labels:
    app: extenddb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extenddb
  template:
    metadata:
      labels:
        app: extenddb
    spec:
      containers:
        - name: extenddb
          image: ${EXTENDDB_IMAGE}
          command:
            - extenddb
            - serve
            - --config
            - /var/lib/extenddb/extenddb.toml
            - --foreground
          ports:
            - containerPort: 18443
              name: https
          env:
            - name: EXTENDDB__STORAGE__MONGODB__CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: extenddb-mongo-uri
                  key: connection_string
          volumeMounts:
            - name: state
              mountPath: /var/lib/extenddb
          readinessProbe:
            exec:
              command: ["extenddb", "healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["extenddb", "healthcheck"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: extenddb-state
---
apiVersion: v1
kind: Service
metadata:
  name: extenddb
  namespace: ${EXTENDDB_NAMESPACE}
spec:
  selector:
    app: extenddb
  ports:
    - name: https
      port: 18443
      targetPort: 18443
  type: ClusterIP
